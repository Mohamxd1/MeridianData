name: DataForge CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: dataforge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dataforge
          POSTGRES_PASSWORD: dataforge
          POSTGRES_DB: dataforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dataforge -d dataforge_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://dataforge:dataforge@localhost:5432/dataforge_test
      SYNC_DATABASE_URL: postgresql://dataforge:dataforge@localhost:5432/dataforge_test
      REDIS_URL: redis://localhost:6379/0
      DATAFORGE_STORAGE_BACKEND: local
      DATAFORGE_DEV_MODE: "true"
      DATAFORGE_RATE_LIMIT_ENABLED: "false"
      DATAFORGE_CORS_ORIGINS: http://localhost:5173
      DATAFORGE_MAX_JSON_BODY_BYTES: "1048576"
      DATAFORGE_DEMO_OWNER_PASSWORD: "ci-only-password-change-me"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest pytest-asyncio alembic psycopg[binary] pip-audit

      - name: Run Alembic migrations
        run: |
          if [ -f alembic.ini ]; then alembic upgrade head; fi

      - name: Alembic dry-run SQL check
        run: |
          if [ -f scripts/check_alembic_dry_run.sh ]; then bash scripts/check_alembic_dry_run.sh; fi

      - name: Run backend tests
        run: pytest -q

      - name: Dependency vulnerability scan
        run: |
          pip-audit || true

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for frontend package
        id: frontend_exists
        run: |
          if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Node
        if: steps.frontend_exists.outputs.exists == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.frontend_exists.outputs.exists == 'true'
        run: npm ci

      - name: Type check
        if: steps.frontend_exists.outputs.exists == 'true'
        run: npm run typecheck --if-present

      - name: Run frontend tests
        if: steps.frontend_exists.outputs.exists == 'true'
        run: npm test --if-present

      - name: Build frontend
        if: steps.frontend_exists.outputs.exists == 'true'
        run: npm run build
